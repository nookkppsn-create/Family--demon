<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100607">
<title>FAMILY-DEMON | ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0809;--panel:#171113;--red:#ff253f;--text:#fff;--muted:#a99a9c;--green:#42e6a4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:white;font:15px Arial,"Noto Sans Thai",sans-serif}
header{padding:20px;background:linear-gradient(135deg,#280811,#100607);border-bottom:1px solid #492027}
h1{margin:0;color:var(--red);letter-spacing:2px;font-size:23px}
header p,.note{color:var(--muted);font-size:12px}
main{max-width:900px;margin:auto;padding:16px}
.card{background:var(--panel);border:1px solid #332025;border-radius:15px;padding:17px;margin-bottom:15px}
h2{font-size:17px;margin:0 0 15px}
input,select{width:100%;padding:12px;margin:5px 0 12px;border:1px solid #493039;border-radius:9px;background:#0e0a0b;color:white}
button{border:0;border-radius:9px;padding:11px 13px;background:var(--red);color:white;font-weight:bold;margin:3px;cursor:pointer}
.secondary{background:#332329}.green{background:#126b4c}.danger{background:#67202b}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#100b0d;padding:15px;border-radius:10px}.stat strong{display:block;font-size:25px;margin-top:8px}
.key{border:1px solid #3a252b;border-radius:11px;padding:13px;margin-top:10px;background:#100b0d}
.keytop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.keycode{font-weight:bold;overflow-wrap:anywhere}
.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#193b2e;color:var(--green)}
.off{background:#452027;color:#ff8795}
.meta{color:var(--muted);font-size:12px;line-height:1.8;margin:10px 0}
#msg{font-size:13px;color:var(--green);overflow-wrap:anywhere}
@media(max-width:500px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}}
</style>
</head>
<body>
<header><h1>FAMILY-DEMON</h1><p>ADMIN CONTROL PANEL · ONLINE DATABASE</p></header>
<main>
<section class="card" id="login">
<h2>เข้าสู่ระบบแอดมิน</h2>
<p class="note">ต้นแบบนี้ยังไม่มีระบบยืนยันตัวตนแอดมินที่ปลอดภัยสำหรับใช้งานจริง</p>
<label>รหัสแอดมิน</label>
<input id="pass" type="password" placeholder="ตั้งรหัสในโค้ดก่อนใช้งาน">
<button id="loginBtn">เข้าสู่ระบบ</button>
<div id="loginMsg" class="note"></div>
</section>

<div id="app" hidden>
<section class="card">
<h2>ภาพรวมระบบ</h2>
<div class="stats">
<div class="stat">คีย์ทั้งหมด<strong id="total">0</strong></div>
<div class="stat">พร้อมใช้งาน<strong id="active">0</strong></div>
<div class="stat">ถูกระงับ<strong id="suspended">0</strong></div>
</div>
</section>

<section class="card">
<h2>สร้างคีย์ใหม่</h2>
<label>ชื่อลูกค้า / หมายเหตุ</label>
<input id="customer" maxlength="80" placeholder="ลูกค้าหมายเลข 01">
<label>จำนวนอุปกรณ์</label>
<select id="limit">
<option value="1">1 เครื่อง</option><option value="2">2 เครื่อง</option>
<option value="3">3 เครื่อง</option><option value="5">5 เครื่อง</option>
<option value="10">10 เครื่อง</option>
</select>
<button id="create">＋ สร้างคีย์</button>
<button id="export" class="secondary">ส่งออก JSON</button>
<div id="msg"></div>
</section>

<section class="card">
<h2>จัดการคีย์</h2>
<input id="search" placeholder="ค้นหาคีย์หรือชื่อลูกค้า">
<div class="row">
<button class="secondary" data-filter="all">ทั้งหมด</button>
<button class="secondary" data-filter="active">พร้อมใช้งาน</button>
<button class="secondary" data-filter="suspended">ถูกระงับ</button>
</div>
<div id="keys"></div>
</section>
<button id="logout" class="secondary">ออกจากระบบ</button>
</div>
</main>

<script>
"use strict";

/* ตั้งค่าการเชื่อมต่อ Supabase */
const SUPABASE_URL="https://msyqlzxmejoorlsadhqi.supabase.co";
const SUPABASE_KEY="sb_publishable_J-0WE4ICTvgAYaWrWlQcjw_InuYzfXK";

/* เปลี่ยนรหัสนี้ได้ แต่รหัสใน HTML ไม่ใช่ระบบรักษาความปลอดภัยจริง */
const ADMIN_PASSWORD="246810";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let allKeys=[];
let filter="all";

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function makeCode(){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 const a=new Uint8Array(8);
 crypto.getRandomValues(a);
 const s=Array.from(a,x=>chars[x%chars.length]).join("");
 return "DEMON-"+s.slice(0,4)+"-"+s.slice(4);
}
function say(t){$("msg").textContent=t}
function getStatus(k){return k.status==="suspended"?"suspended":"active"}

async function loadKeys(){
 say("กำลังโหลดข้อมูล...");
 const {data,error}=await db.from("family_keys")
  .select("id,key_code,customer,status,device_limit")
  .order("id",{ascending:false});
 if(error){say("โหลดไม่สำเร็จ: "+error.message);return}
 allKeys=data||[];
 render();
 say("เชื่อมต่อฐานข้อมูลแล้ว");
}

function render(){
 $("total").textContent=allKeys.length;
 $("active").textContent=allKeys.filter(k=>getStatus(k)==="active").length;
 $("suspended").textContent=allKeys.filter(k=>getStatus(k)==="suspended").length;
 const q=$("search").value.trim().toLowerCase();
 const list=allKeys.filter(k=>{
  const s=getStatus(k);
  return (filter==="all"||filter===s)&&
   ((k.key_code||"").toLowerCase().includes(q)||(k.customer||"").toLowerCase().includes(q));
 });
 $("keys").innerHTML=list.map(k=>{
  const suspended=getStatus(k)==="suspended";
  return `<div class="key">
   <div class="keytop">
    <span class="keycode">${esc(k.key_code)}</span>
    <span class="badge ${suspended?"off":""}">${suspended?"ถูกระงับ":"พร้อมใช้งาน"}</span>
   </div>
   <div class="meta">ลูกค้า: ${esc(k.customer||"-")}<br>
   อุปกรณ์สูงสุด: ${Number(k.device_limit)||1}<br>
   ID: ${esc(k.id)}</div>
   <div class="row">
    <button class="secondary" data-act="copy" data-id="${esc(k.id)}">คัดลอก</button>
    <button class="${suspended?"green":"secondary"}" data-act="toggle" data-id="${esc(k.id)}">${suspended?"เปิดใช้":"ระงับคีย์"}</button>
    <button class="danger" data-act="delete" data-id="${esc(k.id)}">ลบ</button>
   </div>
  </div>`;
 }).join("")||'<p class="note">ไม่พบคีย์</p>';
}

$("loginBtn").onclick=()=>{
 if($("pass").value!==ADMIN_PASSWORD){$("loginMsg").textContent="รหัสผ่านไม่ถูกต้อง";return}
 sessionStorage.setItem("fd_admin_session","yes");
 $("login").hidden=true;$("app").hidden=false;
 loadKeys();
};
$("pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});

$("create").onclick=async()=>{
 const customer=$("customer").value.trim();
 const key_code=makeCode();
 const payload={key_code,customer,status:"active",device_limit:Number($("limit").value)};
 say("กำลังสร้างคีย์...");
 const {error}=await db.from("family_keys").insert(payload);
 if(error){say("สร้างไม่สำเร็จ: "+error.message);return}
 $("customer").value="";
 say("สร้างสำเร็จ: "+key_code);
 await loadKeys();
};

$("search").addEventListener("input",render);
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});

$("keys").addEventListener("click",async e=>{
 const b=e.target.closest("button[data-act]");if(!b)return;
 const k=allKeys.find(x=>String(x.id)===b.dataset.id);if(!k)return;
 if(b.dataset.act==="copy"){
  try{await navigator.clipboard.writeText(k.key_code);say("คัดลอกคีย์แล้ว")}
  catch{prompt("คัดลอกคีย์",k.key_code)}
  return;
 }
 if(b.dataset.act==="toggle"){
  const next=k.status==="suspended"?"active":"suspended";
  const {error}=await db.from("family_keys").update({status:next}).eq("id",k.id);
  if(error){say("แก้ไขไม่สำเร็จ: "+error.message);return}
  say(next==="active"?"เปิดใช้คีย์แล้ว":"ระงับคีย์แล้ว");
 }
 if(b.dataset.act==="delete"){
  if(!confirm("ยืนยันลบคีย์นี้?"))return;
  const {error}=await db.from("family_keys").delete().eq("id",k.id);
  if(error){say("ลบไม่สำเร็จ: "+error.message);return}
  say("ลบคีย์แล้ว");
 }
 await loadKeys();
});

$("export").onclick=()=>{
 const blob=new Blob([JSON.stringify(allKeys,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="family-demon-keys.json";a.click();
 URL.revokeObjectURL(a.href);
};
$("logout").onclick=()=>{
 sessionStorage.removeItem("fd_admin_session");
 $("app").hidden=true;$("login").hidden=false;$("pass").value="";
};
if(sessionStorage.getItem("fd_admin_session")==="yes"){
 $("login").hidden=true;$("app").hidden=false;loadKeys();
}
</script>
</body>
</html>
