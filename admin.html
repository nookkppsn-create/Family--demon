<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100607">
<title>FAMILY-DEMON | ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#0b0809;--panel:#171113;--red:#ff253f;
 --text:#fff;--muted:#a99a9c;--green:#42e6a4;
 --border:#382025
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font:15px Arial,"Noto Sans Thai",sans-serif
}
header{
 padding:22px 16px;
 background:linear-gradient(135deg,#280811,#100607);
 border-bottom:1px solid var(--border)
}
h1{margin:0;color:var(--red);letter-spacing:2px;font-size:24px}
header p,.note{color:var(--muted);font-size:12px;line-height:1.7}
main{max-width:900px;margin:auto;padding:16px}
.card{
 background:var(--panel);border:1px solid #332025;
 border-radius:15px;padding:17px;margin-bottom:15px
}
h2{font-size:17px;margin:0 0 15px}
label{display:block;color:var(--muted);font-size:12px;margin-top:10px}
input,select{
 width:100%;padding:12px;margin:7px 0 12px;
 border:1px solid #493039;border-radius:9px;
 background:#0e0a0b;color:white;font-size:14px
}
button{
 border:0;border-radius:9px;padding:11px 13px;
 background:var(--red);color:white;font-weight:bold;
 margin:3px;cursor:pointer
}
button:disabled{opacity:.5}
.secondary{background:#332329}
.green{background:#126b4c}
.danger{background:#67202b}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#100b0d;padding:14px;border-radius:10px;font-size:12px}
.stat strong{display:block;font-size:26px;margin-top:8px}
.key{
 border:1px solid #3a252b;border-radius:11px;
 padding:13px;margin-top:10px;background:#100b0d
}
.keytop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.keycode{font-weight:bold;overflow-wrap:anywhere;color:white}
.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#193b2e;color:var(--green)}
.off{background:#452027;color:#ff8795}
.meta{color:var(--muted);font-size:12px;line-height:1.9;margin:10px 0;overflow-wrap:anywhere}
#msg,#loginMsg{font-size:13px;line-height:1.8;overflow-wrap:anywhere;white-space:pre-line}
#msg{color:var(--green)}
.error{color:#ff7182!important}
.hidden{display:none!important}
hr{border:0;border-top:1px solid #332025;margin:16px 0}
@media(max-width:500px){
 .stats{grid-template-columns:1fr 1fr}
 .stat:last-child{grid-column:span 2}
}
</style>
</head>

<body>
<header>
 <h1>FAMILY-DEMON</h1>
 <p>ADMIN CONTROL PANEL · ONLINE DATABASE</p>
</header>

<main>
<section class="card" id="login">
 <h2>เข้าสู่ระบบแอดมิน</h2>
 <label for="pass">รหัสผ่านแอดมิน</label>
 <input id="pass" type="password" inputmode="numeric"
  placeholder="กรอกรหัสผ่าน" autocomplete="current-password">
 <button id="loginBtn">เข้าสู่ระบบ</button>
 <div id="loginMsg" class="note"></div>
</section>

<div id="app" hidden>
 <section class="card">
  <h2>ภาพรวมระบบ</h2>
  <div class="stats">
   <div class="stat">คีย์ทั้งหมด<strong id="total">0</strong></div>
   <div class="stat">พร้อมใช้งาน<strong id="active">0</strong></div>
   <div class="stat">ถูกระงับ<strong id="suspended">0</strong></div>
  </div>
  <p class="note" id="connection">รอเชื่อมต่อฐานข้อมูล</p>
 </section>

 <section class="card">
  <h2>ตั้งค่าการสร้างคีย์</h2>

  <label for="maxKeys">จำนวนคีย์สูงสุดที่อนุญาตให้มี</label>
  <input id="maxKeys" type="number" min="1" max="100000"
   value="100" inputmode="numeric">
  <p class="note">จำนวนนี้เป็นขีดจำกัดที่หน้าเว็บใช้ตรวจสอบเบื้องต้น
  ไม่ใช่การล็อกขีดจำกัดที่ปลอดภัยบนเซิร์ฟเวอร์</p>

  <hr>

  <h2>สร้างคีย์ใหม่</h2>

  <label for="customer">ชื่อลูกค้า / หมายเหตุ</label>
  <input id="customer" maxlength="80" placeholder="ลูกค้าหมายเลข 01">

  <label for="duration">ระยะเวลาใช้งาน</label>
  <select id="duration">
   <option value="1">1 วัน</option>
   <option value="3">3 วัน</option>
   <option value="7" selected>7 วัน</option>
   <option value="15">15 วัน</option>
   <option value="30">30 วัน</option>
   <option value="90">90 วัน</option>
   <option value="365">365 วัน</option>
   <option value="permanent">ถาวร</option>
  </select>

  <label for="limit">จำนวนอุปกรณ์สูงสุดต่อคีย์</label>
  <select id="limit">
   <option value="1">1 เครื่อง</option>
   <option value="2">2 เครื่อง</option>
   <option value="3">3 เครื่อง</option>
   <option value="5">5 เครื่อง</option>
   <option value="10">10 เครื่อง</option>
   <option value="15">15 เครื่อง</option>
   <option value="20">20 เครื่อง</option>
   <option value="30">30 เครื่อง</option>
  </select>

  <button id="create">＋ สร้างคีย์</button>
  <button id="export" class="secondary">ส่งออก JSON</button>
  <div id="msg"></div>
 </section>

 <section class="card">
  <h2>จัดการคีย์</h2>
  <input id="search" placeholder="ค้นหาคีย์หรือชื่อลูกค้า">

  <div class="row">
   <button class="secondary" data-filter="all">ทั้งหมด</button>
   <button class="secondary" data-filter="active">พร้อมใช้งาน</button>
   <button class="secondary" data-filter="suspended">ถูกระงับ</button>
  </div>

  <div id="keys"></div>
 </section>

 <button id="reload" class="secondary">รีเฟรชข้อมูล</button>
 <button id="logout" class="secondary">ออกจากระบบ</button>
</div>
</main>

<script>
"use strict";

/* SUPABASE PROJECT เดิม */
const SUPABASE_URL="https://msyqlzxmejoorlsadhqi.supabase.co";
const SUPABASE_KEY="sb_publishable_J-0WE4ICTvgAYaWrWlQcjw_InuYzfXK";

/* รหัสผ่านสำหรับหน้าเว็บต้นแบบเท่านั้น */
const ADMIN_PASSWORD="123456";

/*
 ตารางเดิม:
 family_keys:
 id, key_code, customer, status, device_limit

 เพิ่มเติม:
 expires_at ต้องมีในฐานข้อมูล หากต้องการบันทึกวันหมดอายุจริง
*/

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

let allKeys=[];
let filter="all";
let busy=false;

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function say(text,error=false){
 $("msg").textContent=text;
 $("msg").classList.toggle("error",error);
}

function makeCode(){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 const bytes=new Uint8Array(12);
 crypto.getRandomValues(bytes);
 const s=Array.from(bytes,b=>chars[b%chars.length]).join("");
 return "DEMON-"+s.slice(0,4)+"-"+s.slice(4,8)+"-"+s.slice(8);
}

function isExpired(k){
 if(!k.expires_at)return false;
 const t=Date.parse(k.expires_at);
 return Number.isFinite(t)&&t<=Date.now();
}

function statusOf(k){
 if(k.status==="suspended")return "suspended";
 if(isExpired(k))return "expired";
 return "active";
}

function expiryText(k){
 if(!k.expires_at)return "ถาวร / ไม่มีวันหมดอายุ";
 const date=new Date(k.expires_at);
 if(!Number.isFinite(date.getTime()))return "ไม่ทราบวันหมดอายุ";
 return date.toLocaleString("th-TH",{dateStyle:"medium",timeStyle:"short"});
}

async function loadKeys(){
 say("กำลังโหลดข้อมูล...");
 $("connection").textContent="กำลังเชื่อมต่อ Supabase...";

 const {data,error}=await db.from("family_keys")
  .select("*")
  .order("id",{ascending:false});

 if(error){
  $("connection").textContent="เชื่อมต่อไม่สำเร็จ";
  say("โหลดคีย์ไม่สำเร็จ: "+error.message,true);
  return;
 }

 allKeys=data||[];
 render();
 $("connection").textContent="โหลดข้อมูลจาก Supabase แล้ว";
 say("โหลดข้อมูลสำเร็จ");
}

function render(){
 $("total").textContent=allKeys.length;
 $("active").textContent=allKeys.filter(k=>statusOf(k)==="active").length;
 $("suspended").textContent=allKeys.filter(k=>statusOf(k)==="suspended").length;

 const q=$("search").value.trim().toLowerCase();

 const list=allKeys.filter(k=>{
  const s=statusOf(k);
  const matchesFilter=filter==="all"||filter===s;
  const matchesSearch=String(k.key_code||"").toLowerCase().includes(q)
   ||String(k.customer||"").toLowerCase().includes(q);
  return matchesFilter&&matchesSearch;
 });

 $("keys").innerHTML=list.map(k=>{
  const s=statusOf(k);
  const suspended=s==="suspended";
  const expired=s==="expired";

  return `<div class="key">
   <div class="keytop">
    <span class="keycode">${esc(k.key_code)}</span>
    <span class="badge ${suspended||expired?"off":""}">
     ${suspended?"ถูกระงับ":expired?"หมดอายุ":"พร้อมใช้งาน"}
    </span>
   </div>

   <div class="meta">
    ลูกค้า: ${esc(k.customer||"-")}<br>
    อุปกรณ์สูงสุด: ${Number(k.device_limit)||1} เครื่อง<br>
    วันหมดอายุ: ${esc(expiryText(k))}<br>
    ID: ${esc(k.id)}
   </div>

   <div class="row">
    <button class="secondary" data-act="copy" data-id="${esc(k.id)}">คัดลอก</button>
    <button class="${suspended?"green":"secondary"}"
     data-act="toggle" data-id="${esc(k.id)}">
     ${suspended?"เปิดใช้":"ระงับคีย์"}
    </button>
    <button class="danger" data-act="delete" data-id="${esc(k.id)}">ลบ</button>
   </div>
  </div>`;
 }).join("")||'<p class="note">ไม่พบคีย์</p>';
}

async function login(){
 if($("pass").value!==ADMIN_PASSWORD){
  $("loginMsg").textContent="รหัสผ่านไม่ถูกต้อง";
  $("loginMsg").classList.add("error");
  return;
 }

 $("loginMsg").textContent="";
 sessionStorage.setItem("fd_admin_session","yes");
 $("login").hidden=true;
 $("app").hidden=false;
 await loadKeys();
}

$("loginBtn").addEventListener("click",login);
$("pass").addEventListener("keydown",e=>{
 if(e.key==="Enter")login();
});

$("create").addEventListener("click",async()=>{
 if(busy)return;

 const max=Math.floor(Number($("maxKeys").value));
 if(!Number.isInteger(max)||max<1){
  say("กรุณากำหนดจำนวนคีย์สูงสุดให้ถูกต้อง",true);
  return;
 }

 if(allKeys.length>=max){
  say("ถึงจำนวนคีย์สูงสุดที่กำหนดแล้ว",true);
  return;
 }

 const customer=$("customer").value.trim();
 const deviceLimit=Number($("limit").value);
 const duration=$("duration").value;

 if(![1,2,3,5,10,15,20,30].includes(deviceLimit)){
  say("จำนวนอุปกรณ์ไม่ถูกต้อง",true);
  return;
 }

 const key_code=makeCode();
 const payload={
  key_code,
  customer,
  status:"active",
  device_limit:deviceLimit
 };

 /*
  เพิ่ม expires_at เมื่อเลือกแบบมีวันหมดอายุ
  หากตารางยังไม่มีคอลัมน์นี้ โค้ดจะไม่เขียนคอลัมน์ดังกล่าว
  และแจ้งให้ทราบแทนการแอบอ้างว่าบันทึกวันหมดอายุแล้ว
 */
 if(duration!=="permanent"){
  const expiresAt=new Date(Date.now()+Number(duration)*86400000).toISOString();
  payload.expires_at=expiresAt;
 }

 busy=true;
 $("create").disabled=true;
 say("กำลังสร้างคีย์...");

 try{
  let result=await db.from("family_keys").insert(payload);

  if(result.error&&payload.expires_at&&
     /expires_at|column/i.test(result.error.message)){
   say("ฐานข้อมูลยังไม่มี expires_at จึงยังบันทึกวันหมดอายุไม่ได้ กรุณาเพิ่มคอลัมน์นี้ก่อน",true);
   return;
  }

  if(result.error){
   say("สร้างคีย์ไม่สำเร็จ: "+result.error.message,true);
   return;
  }

  $("customer").value="";
  say("สร้างคีย์สำเร็จ: "+key_code);
  await loadKeys();
 }catch(e){
  say("เกิดข้อผิดพลาด: "+(e.message||e),true);
 }finally{
  busy=false;
  $("create").disabled=false;
 }
});

$("search").addEventListener("input",render);

document.querySelectorAll("[data-filter]").forEach(b=>{
 b.addEventListener("click",()=>{
  filter=b.dataset.filter;
  render();
 });
});

$("keys").addEventListener("click",async e=>{
 const b=e.target.closest("button[data-act]");
 if(!b||busy)return;

 const k=allKeys.find(x=>String(x.id)===b.dataset.id);
 if(!k)return;

 if(b.dataset.act==="copy"){
  try{
   await navigator.clipboard.writeText(k.key_code);
   say("คัดลอกคีย์แล้ว");
  }catch{
   prompt("คัดลอกคีย์นี้",k.key_code);
  }
  return;
 }

 if(b.dataset.act==="toggle"){
  const next=k.status==="suspended"?"active":"suspended";
  if(!confirm(next==="suspended"?"ยืนยันระงับคีย์นี้?":"ยืนยันเปิดใช้คีย์นี้?"))return;

  busy=true;
  try{
   const {error}=await db.from("family_keys")
    .update({status:next}).eq("id",k.id);

   if(error){say("แก้ไขไม่สำเร็จ: "+error.message,true);return}
   say(next==="active"?"เปิดใช้คีย์แล้ว":"ระงับคีย์แล้ว");
   await loadKeys();
  }finally{busy=false}
  return;
 }

 if(b.dataset.act==="delete"){
  if(!confirm("ยืนยันลบคีย์นี้? การลบอาจไม่สามารถย้อนกลับได้"))return;

  busy=true;
  try{
   const {error}=await db.from("family_keys").delete().eq("id",k.id);
   if(error){say("ลบไม่สำเร็จ: "+error.message,true);return}
   say("ลบคีย์แล้ว");
   await loadKeys();
  }finally{busy=false}
 }
});

$("export").addEventListener("click",()=>{
 const blob=new Blob([JSON.stringify(allKeys,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="family-demon-keys.json";
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
});

$("reload").addEventListener("click",loadKeys);

$("logout").addEventListener("click",()=>{
 sessionStorage.removeItem("fd_admin_session");
 $("app").hidden=true;
 $("login").hidden=false;
 $("pass").value="";
});

if(sessionStorage.getItem("fd_admin_session")==="yes"){
 $("login").hidden=true;
 $("app").hidden=false;
 loadKeys();
}
</script>
</body>
</html>
