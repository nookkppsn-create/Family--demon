<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>FAMILY-DEMON | Player</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
header{background:#170609;border-bottom:2px solid #e21b32;padding:20px;text-align:center}
h1{margin:0;color:#ff2638;font-size:23px}
small{color:#aaa}
main{max-width:450px;margin:auto;padding:16px}
.card{background:#151515;border:1px solid #333;border-radius:12px;padding:17px;margin-bottom:14px}
h3{margin:0 0 14px}
input{width:100%;padding:13px;background:#080808;border:1px solid #444;border-radius:8px;color:white}
button{width:100%;padding:13px;border:0;border-radius:8px;margin-top:10px;background:#d71932;color:white;font-weight:bold}
.secondary{background:#292929}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #303030;font-size:13px}
.row span:last-child{text-align:right;overflow-wrap:anywhere}
.green{color:#36e69a}
.red{color:#ff465a}
.hide{display:none}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu button{margin:0;background:#252525}
#msg{font-size:13px;margin-top:10px;color:#ff5265}
footer{text-align:center;color:#666;font-size:11px;padding:20px}
</style>
</head>
<body>

<header>
<h1>FAMILY-DEMON</h1>
<small>PLAYER PANEL</small>
</header>

<main>
<section id="login" class="card">
<h3>🔑 เข้าสู่ระบบ</h3>
<input id="key" placeholder="กรอกคีย์ผู้เล่น">
<button onclick="login()">เข้าสู่ระบบ</button>
<div id="msg"></div>
</section>

<section id="panel" class="hide">
<div class="card">
<h3>👹 หน้าหลักผู้เล่น</h3>
<div class="row"><span>สถานะ</span><b class="green" id="status">ออนไลน์</b></div>
<div class="row"><span>คีย์</span><span id="showkey">-</span></div>
<div class="row"><span>อุปกรณ์</span><span id="device">-</span></div>
<div class="row"><span>วันหมดอายุ</span><span id="expiry">-</span></div>
<div class="row"><span>เวลาคงเหลือ</span><span id="remaining">-</span></div>
</div>

<div class="card">
<h3>⚙️ เมนู</h3>
<div class="menu">
<button onclick="info()">ข้อมูลคีย์</button>
<button onclick="checkKey()">ตรวจสอบคีย์</button>
<button onclick="alert('ต้องเชื่อมระบบฟังก์ชันเพิ่มเติมก่อน')">ฟังก์ชัน</button>
<button onclick="logout()">ออกจากระบบ</button>
</div>
<p id="info"></p>
</div>
</section>
</main>

<footer>FAMILY-DEMON · PLAYER</footer>

<script>
const STORE="family_demon_admin_demo_v1";
const SESSION="family_demon_player_session_v1";

function getKeys(){
 try{
  let d=JSON.parse(localStorage.getItem(STORE)||"null");
  return Array.isArray(d)?d:(d&&Array.isArray(d.keys)?d.keys:[]);
 }catch(e){return []}
}

function value(o,keys){
 for(const k of keys)if(o[k]!==undefined&&o[k]!==null)return o[k];
 return "";
}

function findKey(k){
 return getKeys().find(x=>
 String(value(x,["key","code","licenseKey","license"]))
 .toUpperCase()===k.toUpperCase());
}

function getExpiry(o){
 let v=value(o,["expiresAt","expiry","expires","expireAt","expirationDate"]);
 if(v){
  let n=new Date(v).getTime();
  if(Number.isFinite(n))return n;
 }
 let days=Number(value(o,["durationDays","days"]));
 let start=Number(value(o,["activatedAt","createdAt","created"]));
 return days>0&&start>0?start+days*86400000:0;
}

function validate(o){
 let s=String(value(o,["status","state"])||"active").toLowerCase();
 if(s.includes("suspend")||s.includes("ระงับ"))return "คีย์ถูกระงับ";
 if(s.includes("expire")||s.includes("หมดอายุ"))return "คีย์หมดอายุ";
 let exp=getExpiry(o);
 if(exp&&Date.now()>=exp)return "คีย์หมดอายุ";
 if(!s.includes("active")&&!s.includes("ใช้งาน")&&!s.includes("ปกติ"))return "สถานะคีย์ไม่ถูกต้อง";
 return "";
}

function login(){
 let k=document.getElementById("key").value.trim();
 let m=document.getElementById("msg");
 if(!k){m.textContent="กรุณากรอกคีย์";return}
 let o=findKey(k);
 if(!o){m.textContent="ไม่พบคีย์ในข้อมูลแอดมินของเบราว์เซอร์นี้";return}
 let err=validate(o);
 if(err){m.textContent=err;return}
 localStorage.setItem(SESSION,k);
 render(o);
}

function render(o){
 document.getElementById("login").classList.add("hide");
 document.getElementById("panel").classList.remove("hide");
 document.getElementById("showkey").textContent=value(o,["key","code","licenseKey","license"])||"-";
 document.getElementById("device").textContent=
 /Android/i.test(navigator.userAgent)?"Android":/iPhone|iPad/i.test(navigator.userAgent)?"iOS":"อุปกรณ์อื่น";
 let exp=getExpiry(o);
 document.getElementById("expiry").textContent=exp?new Date(exp).toLocaleString("th-TH"):"ไม่ระบุ";
 updateTime();
}

function updateTime(){
 let k=localStorage.getItem(SESSION);
 let o=k&&findKey(k);
 if(!o)return;
 let err=validate(o);
 if(err){
  document.getElementById("status").textContent=err;
  document.getElementById("status").className="red";
  document.getElementById("remaining").textContent="-";
  return;
 }
 let exp=getExpiry(o);
 document.getElementById("remaining").textContent=exp?
 Math.max(0,Math.ceil((exp-Date.now())/3600000))+" ชั่วโมง":"ไม่ระบุ";
}

function checkKey(){
 let k=localStorage.getItem(SESSION);
 let o=k&&findKey(k);
 if(!o){logout();alert("ไม่พบคีย์");return}
 let err=validate(o);
 if(err){logout();alert(err);return}
 render(o);
 alert("คีย์ใช้งานได้");
}

function info(){
 document.getElementById("info").textContent=
 "ตรวจสอบคีย์และวันหมดอายุจากข้อมูลที่หน้าเว็บนี้เข้าถึงได้";
}

function logout(){
 localStorage.removeItem(SESSION);
 document.getElementById("panel").classList.add("hide");
 document.getElementById("login").classList.remove("hide");
 document.getElementById("key").value="";
 document.getElementById("msg").textContent="";
}

window.addEventListener("load",()=>{
 let k=localStorage.getItem(SESSION);
 let o=k&&findKey(k);
 if(o&&!validate(o))render(o);
});
setInterval(updateTime,60000);
</script>
</body>
</html>
